version: '3.8'

services:
  postgres-db:
    image: postgres:17
    container_name: postgres-weg-workshop
    environment:
      POSTGRES_DB: postgres-att
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: